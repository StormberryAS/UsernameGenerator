name: Android release

# Tagged android-v* only. The repo also serves the web app at username.stormberry.as,
# so the prefix keeps app releases from colliding with anything the site ever tags.
on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:

permissions:
  contents: write        # create the release
  id-token: write        # sign the provenance attestation
  attestations: write    # publish it

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Runs BEFORE the build, so a release cannot be cut while the three
      # implementations disagree about what a username is worth. Catches two
      # things the Kotlin test cannot: a golden corpus left stale after script.js
      # changed, and username.py drifting away from the other two entirely.
      # working-directory is overridden because this one lives at the repo root.
      - name: Check strength parity across web, Android and CLI
        working-directory: .
        run: python3 tools/check-strength-parity.py

      # The runner ships an Android SDK, but not necessarily platform 37.1, and its
      # bundled sdkmanager may be too old to know that package exists. Refresh
      # cmdline-tools first, then install, and let the output show if it fails.
      - name: Install SDK packages the runner may not have
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "cmdline-tools;latest" > /dev/null
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.1" "build-tools;36.0.0"

      # The keystore is decoded into RUNNER_TEMP, which sits outside the workspace,
      # so no artifact glob or accidental `git add` can ever pick it up.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Credentials reach Gradle as ORG_GRADLE_PROJECT_* env vars, which Gradle maps
      # to project properties. Nothing is written to a file a build script might log.
      - name: Build signed release APK
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # testDebugUnitTest FIRST, so a release cannot be cut past a failing test.
        # It was absent until 2026-08-22, which meant the six JVM test classes in
        # this repo had never run in CI once: the golden-corpus checks behind the
        # strength readout, the digit contract, the language modes and the
        # sanitise parity all passed only on whatever machine last ran them by
        # hand. SunApp's workflow had it from the start; this brings the two into
        # line.
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      # Fails the release if signing silently fell back to unsigned, and asserts the
      # zero-permissions claim in CI rather than trusting it.
      - name: Verify signature and permissions
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk

          # Newest build-tools that actually carries what this step needs. Taking the
          # highest version blindly is not safe: a partial download, or a release that
          # drops the legacy aapt, would fail the build for a reason that has nothing
          # to do with the APK.
          BUILD_TOOLS=""
          for d in $(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -Vr); do
            if [ -x "$d/apksigner" ] && { [ -x "$d/aapt2" ] || [ -x "$d/aapt" ]; }; then
              BUILD_TOOLS="${d%/}"
              break
            fi
          done
          if [ -z "$BUILD_TOOLS" ]; then
            echo "::error::no build-tools install carries both apksigner and aapt/aapt2"
            ls -d "$ANDROID_HOME"/build-tools/*/ || true
            exit 1
          fi
          echo "Using $BUILD_TOOLS"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

          # aapt2 prints the same "uses-permission: name='...'" lines as aapt v1.
          AAPT="$BUILD_TOOLS/aapt2"
          [ -x "$AAPT" ] || AAPT="$BUILD_TOOLS/aapt"
          PERMS=$("$AAPT" dump permissions "$APK" | grep -c "uses-permission" || true)
          if [ "$PERMS" -ne 0 ]; then
            echo "::error::APK declares $PERMS permission(s); this app must declare none."
            "$AAPT" dump permissions "$APK"
            exit 1
          fi
          echo "Verified: zero permissions."

      - name: Remove keystore
        if: always()
        run: shred -u "$RUNNER_TEMP/release.jks" || rm -f "$RUNNER_TEMP/release.jks"

      # Lets anyone prove this exact binary came out of this repo and this run:
      #   gh attestation verify app-release.apk -R StormberryAS/UsernameGenerator
      - uses: actions/attest-build-provenance@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          VERSION="${GITHUB_REF_NAME#android-}"
          cp "$APK" "UsernameGenerator-${VERSION}.apk"
          sha256sum "UsernameGenerator-${VERSION}.apk" > "UsernameGenerator-${VERSION}.apk.sha256"
          gh release create "$GITHUB_REF_NAME" \
            "UsernameGenerator-${VERSION}.apk" \
            "UsernameGenerator-${VERSION}.apk.sha256" \
            --title "UsernameGenerator for Android ${VERSION}" \
            --generate-notes
