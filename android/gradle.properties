org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Reproducibility. A third party rebuilding from a tag gets the same bytes, so nothing that
# varies per machine or per checkout may leak into the APK. Measured 2026-09-03 on v1.1.1:
# identical with Temurin 21.0.12.1+1, the JDK CI installs; different classes.dex with Debian
# OpenJDK 21.0.12.1, the same upstream version from another vendor. The guarantee is
# therefore conditional on the JDK build, not only its version. Recipe in android/README.md
# under "Reproducing a release byte for byte".
android.vcsInfo.enabled=false
