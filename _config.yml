# GitHub Pages serves the web app from the repository root. Everything below is
# source or tooling that should not end up on username.stormberry.as.
exclude:
  - android/
  - venv/
  - build_dicts.py
  - build_dicts_robust.py
  - username.py
  - README.md
  - LICENSE
  - zapstore.yaml
  - fastlane/
  - tools/
  - NOTICE
  - DISCLAIMER.md
  - bump_assets.py
  - PRIVACY.md

# data/ is deliberately NOT excluded: script.js fetches data/<lang>_<cat>.txt and
# data/entropy-model.tsv from the live site at runtime, so excluding it would 404
# every dictionary and leave the generator serving its fallback word forever.
# bump_assets.py and PRIVACY.md added 2026-09-05: both were still reachable from the
# live site. privacy.html is the PUBLISHED page and stays served; only its Markdown
# source is withheld, the same rule DISCLAIMER.md already follows.
